[build]
dist = "../../dist"

[serve]
port = 8088

[[proxy]]
rewrite = "/api/"
backend = "http://localhost:3000/api/"
no_redirect = true

[[proxy]]
rewrite = "/auth/"
backend = "http://localhost:3000/auth/"
no_redirect = true

[[proxy]]
rewrite = "/status/"
backend = "http://localhost:3000/status/"
no_redirect = true
